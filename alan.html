<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alan Neves - Estagiário</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.3em;
    }

    .subtitle {
      font-size: 1.5em;
      color: #ccc;
      margin-bottom: 2em;
    }

    .photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      margin-bottom: 1.5em;
    }

    .intro {
      max-width: 600px;
      margin: 0 auto 2em auto;
      font-size: 1.2em;
      line-height: 1.6;
    }

    /* Estilo para links dentro do intro */
  .intro a {
    color: #1DB954;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s ease;
  }

  .intro a:hover {
    color: #1aa34a;
    text-decoration: underline;
  }

  /* Estilo para links normais */
  a:not(.github-link) {
    color: #1DB954;
    text-decoration: none;
  }

  a:not(.github-link):hover {
    text-decoration: underline;
  }

    a.github-link {
      display: inline-block;
      margin-top: 1em;
      padding: 10px 20px;
      background-color: #1DB954;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      transition: background-color 0.3s ease;
    }

    a.github-link:hover {
      background-color: #1aa34a;
    }

    footer {
      margin-top: 4em;
      font-size: 0.9em;
      color: #aaa;
    }

    /* Animação de entrada */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      animation: fadeIn 1s ease-in;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://github.com/alan-neves.png" alt="Foto de Alan" class="photo">

    <h1>Olá, devs!</h1>
    <div class="subtitle">Boas vindas ao meu espaço :)</div>

    <p class="intro">
      Me chamo <strong>Alan Neves</strong>, fui estagiário em Desenvolvimento de Sistemas na Seção Técnica de Informática da FFLCH e trabalhei em projetos Laravel. <br><br>

      Sistemas em que contribuí: <br>
      <a href="https://github.com/fflch/fechaduras">Fechaduras FFLCH</a><br>
      <a href="https://github.com/fflch/rede">Rede FFLCH</a>
    </p>

    <a class="github-link" href="https://github.com/alan-neves" target="_blank">Visite meu GitHub</a>

    <footer>
      Alan Neves | <span id="dataAtual"></span>
    </footer>

    <script>
    function atualizarData() {
      const agora = new Date();
      const ano = agora.getFullYear();
      document.getElementById('dataAtual').textContent = ano;
    }
    atualizarData();
  </script>
  </div>
</body>
</html>
